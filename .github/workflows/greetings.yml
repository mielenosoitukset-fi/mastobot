name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Hi @${{ github.actor }} 👋 thanks for opening your first issue!"
          pr-message: "Hey @${{ github.actor }} 💖 thanks for your first pull request!"
